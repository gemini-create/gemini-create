<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0033">
        <animate attributeName="stop-color" values="#1a0033;#2d0a4e;#1a0033" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#6a1b9a">
        <animate attributeName="stop-color" values="#6a1b9a;#c2185b;#6a1b9a" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#f3c5ff"/>
      <stop offset="1" stop-color="#ff8fc7"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c77dff"/>
      <stop offset="1" stop-color="#ff5fa2"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.12"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1000" height="260" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <rect width="1000" height="260" fill="url(#dots)"/>

    <!-- glowing orbs -->
    <circle cx="170" cy="80" r="90" fill="#e0529c" opacity="0.5" filter="url(#blur)">
      <animate attributeName="cx" values="170;330;170" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="80;140;80" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="830" cy="200" r="110" fill="#7c4dff" opacity="0.5" filter="url(#blur)">
      <animate attributeName="cx" values="830;660;830" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="200;110;200" dur="8s" repeatCount="indefinite"/>
    </circle>

    <!-- twinkling stars -->
    <g fill="#ffffff">
      <circle cx="90" cy="50" r="1.8"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="260" cy="30" r="1.4"><animate attributeName="opacity" values="1;0.1;1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="420" cy="60" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="610" cy="35" r="1.8"><animate attributeName="opacity" values="1;0.1;1" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="70" r="1.4"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="900" cy="40" r="1.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="150" cy="210" r="1.5"><animate attributeName="opacity" values="1;0.1;1" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="940" cy="150" r="1.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.1s" repeatCount="indefinite"/></circle>
    </g>

    <!-- floating code symbols -->
    <g font-family="Consolas, 'Courier New', monospace" font-size="22" fill="#ffffff" opacity="0.18">
      <text x="70" y="250">&lt;/&gt;
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -270" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="230" y="250">{ }
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -270" dur="15s" begin="-6s" repeatCount="indefinite"/>
      </text>
      <text x="780" y="250">=&gt;
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -270" dur="13s" begin="-3s" repeatCount="indefinite"/>
      </text>
      <text x="900" y="250">[ ]
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -270" dur="16s" begin="-9s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- name -->
    <text x="500" y="128" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="60" font-weight="800" fill="url(#txt)" filter="url(#glow)" opacity="0">
      Hania Mubashar
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 18" to="0 0" dur="1.2s" fill="freeze"/>
    </text>

    <!-- subtitle -->
    <text x="500" y="176" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="6" fill="#f5d0ff" opacity="0">
      FULL STACK DEVELOPER  ·  MERN STACK
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.8s" fill="freeze"/>
    </text>

    <!-- underline sweep -->
    <rect x="500" y="198" width="0" height="3" rx="1.5" fill="url(#line)">
      <animate attributeName="x" from="500" to="410" dur="1s" begin="1.2s" fill="freeze"/>
      <animate attributeName="width" from="0" to="180" dur="1s" begin="1.2s" fill="freeze"/>
    </rect>
  </g>

  <rect x="1" y="1" width="998" height="258" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.15"/>
</svg>